<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASA Pest Control Pakistan – ERP</title>
<style>
:root{--r:#C8102E;--d:#8e0b20;--k:#2b1114;--g:#fdf1f1;--l:#f0cfd2}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif;color:var(--k);background:linear-gradient(160deg,#fff 40%,#fbe3e5);min-height:100vh;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#app{display:none;min-height:100vh}#app.on{display:flex;flex-direction:column}
aside{width:100%;background:linear-gradient(90deg,#e0233f,#a30c22);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 6px 16px rgba(120,0,20,.35);position:relative;z-index:2}
.lg{background:#fff;border-radius:10px;padding:4px 10px;box-shadow:0 3px 8px rgba(0,0,0,.25);flex:none;line-height:0}.lg img{height:58px;width:auto}
#nav{display:flex;flex-wrap:wrap;gap:6px;flex:1}aside button{display:inline-block;width:auto;white-space:nowrap;margin:0;text-align:center;background:rgba(255,255,255,.1);border:0;border-bottom:3px solid rgba(0,0,0,.25);color:#fff;padding:9px 10px;margin-bottom:6px;border-radius:8px;font:inherit;cursor:pointer;transition:.15s}
aside button:hover{transform:translateX(5px);background:rgba(255,255,255,.22)}aside button.on{background:#fff;color:var(--r);font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.me{font-size:13px;margin-left:auto;margin-top:0;padding:6px 10px;background:rgba(0,0,0,.2);border-radius:8px}
main{flex:1;padding:22px;min-width:0}h2{margin:0 0 14px;color:var(--d);text-shadow:0 2px 0 #fff,0 4px 6px rgba(160,10,30,.25)}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 0 #f3d5d8,0 18px 30px rgba(160,10,30,.18);transition:transform .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:2fr 1fr 80px;gap:8px;margin-bottom:6px}
label{font-size:12.5px;color:#7a4a50;display:block}input,select,textarea{width:100%;padding:8px;border:1px solid var(--l);border-radius:8px;font:inherit;background:#fff;box-shadow:inset 0 2px 4px rgba(120,0,20,.08)}
.btn{display:inline-block;text-decoration:none;background:linear-gradient(#e8344d,var(--r));color:#fff;border:0;border-bottom:4px solid var(--d);border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 12px rgba(160,10,30,.3);margin:2px 0;transition:.1s}
.btn:active{transform:translateY(3px);border-bottom-width:1px}.btn.s{background:#fff;color:var(--r);border:1px solid var(--r);border-bottom-width:3px;padding:5px 9px;font-weight:600;font-size:13px;box-shadow:none}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border-bottom:1px solid var(--l);padding:8px;text-align:left;font-size:14px}th{background:var(--g);color:var(--d)}
.wrap{overflow-x:auto}.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.kpi div{background:linear-gradient(#fff,var(--g));padding:12px 18px;border-left:5px solid var(--r);min-width:150px;border-radius:10px;box-shadow:0 6px 0 #f3d5d8,0 10px 16px rgba(160,10,30,.15);transition:transform .2s}.kpi div:hover{transform:perspective(600px) rotateX(8deg) translateY(-4px)}.kpi b{font-size:22px;display:block}
.tag{padding:2px 8px;border-radius:10px;background:var(--g);font-size:12px}.tag.d{background:#d8f0dc}.warn{background:#fff3cd;padding:10px;border-radius:8px;border-left:4px solid #e0a800}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;perspective:1000px;padding:16px}
#lc{width:350px;background:#fff;border-radius:18px;padding:26px;text-align:center;box-shadow:0 12px 0 #f3d5d8,0 30px 50px rgba(160,10,30,.35);transition:transform .1s}#lc img{height:130px;animation:fl 4s ease-in-out infinite}#lc input{margin-bottom:10px}
@keyframes fl{50%{transform:translateY(-8px) rotateY(12deg)}}@media(prefers-reduced-motion:reduce){#lc img{animation:none}}
#md{display:none;position:fixed;inset:0;background:rgba(40,0,8,.55);align-items:center;justify-content:center;z-index:9;padding:12px}.mb{background:#fff;border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 12px 0 var(--d)}
#pr{display:none}#msg{position:fixed;right:14px;bottom:14px;background:var(--d);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:10}
.doc{padding:28px 34px;page-break-after:always;font-size:13.5px;color:#000}.doc .hd{border-bottom:4px solid var(--r);padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px}.hl{display:flex;gap:12px;align-items:center}
.doc h3{font-size:20px;margin:0 0 10px;color:var(--r)}.doc td,.doc th{font-size:13px}.doc ol{padding-left:18px}.sig{display:flex;gap:40px;margin-top:50px}.sig div{flex:1;border-top:1px solid #000;padding-top:4px}
@media(max-width:760px){#app.on{flex-direction:column}aside{width:100%}}
@media print{#login,#app,#msg,#md{display:none!important}#pr{display:block}.doc{padding:0}}
</style></head><body>

<div id="md" onclick="if(event.target==this)mc()"></div><div id="pr"></div><div id="msg"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>'PKR '+Math.round(n).toLocaleString('en-US'),esc=t=>String(t==null?'':t).replace(/[<>&"]/g,'');
const LOGO=document.querySelector('#lc img').src;
const CO={name:'MASA Pest Control Pakistan',addr:'268 D PIA Housing Society, Lahore',ph:'+92 332 2333391',mail:'info@masapestcontrol.org.pk · sales@masapestcontrol.org.pk · operations@masapestcontrol.org.pk',web:'masapestcontrol.org.pk'};
const STEP={'One-time':0,Weekly:7,Fortnightly:14,Monthly:30,Quarterly:90};
const SVC=['General Pest Control','Termite Control','Termite Proofing','IPM (Integrated Pest Management)','Fly Management','Rodent Control','Mosquito / Dengue Fogging','Bed Bug Treatment','Fumigation','Disinfection'];
const isT=s=>/^Termite/.test(s);
let S;try{S=JSON.parse(localStorage.masaPK)}catch(e){}
S=S||{};S.jobs=S.jobs||[];S.visits=S.visits||[];S.chems=S.chems||[];S.seq=S.seq||{q:0,s:0,c:0};S.url=S.url||'';S.users=S.users||[];S.cfg=S.cfg||{wa:'',mail:'operations@masapestcontrol.org.pk'};
let me=null,U='Minutes',CUR='Quick Job';
const save=()=>{try{localStorage.masaPK=JSON.stringify(S)}catch(e){}};
const msg=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2800)};
const modal=h=>{$('#md').innerHTML=`<div class="mb">${h}<p><button class="btn s" onclick="mc()">Close</button></p></div>`;$('#md').style.display='flex'},mc=()=>$('#md').style.display='none';
const hash=async t=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('masa|'+t));return'x'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(t)}};
const num=(p,k)=>p+'-'+new Date().getFullYear()+'-'+String(++S.seq[k]).padStart(4,'0');
function sync(type,rec){if(!S.url)return;if(!Array.isArray(rec))rec=Object.fromEntries(Object.entries(rec).map(([k,v])=>[k,v&&typeof v=='object'?JSON.stringify(v):v]));fetch(S.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({type,rec})}).catch(()=>{})}
const usv=()=>{save();sync('users_all',S.users)};
/* ---------- login ---------- */
async function boot(){if(!S.users.length){S.users=[{id:'admin',name:'Administrator',role:'admin',h:await hash('ChangeMe123'),def:1}];save()}try{me=S.users.find(u=>u.id==sessionStorage.masaU)}catch(e){}me?start():0}
async function login(){const u=S.users.find(x=>x.id==$('#lu').value.trim().toLowerCase());if(!u||u.h!=await hash($('#lp').value)){$('#le').textContent='Wrong user ID or password';return}me=u;try{sessionStorage.masaU=u.id}catch(e){}start()}
function conn(){const u=prompt('Paste the company Google Sheet web app URL (ends in /exec)');if(!u)return;S.url=u.trim();save();pull(()=>alert('Connected. '+S.users.length+' user(s) loaded from the sheet. Now log in.'),1)}
function start(){$('#login').style.display='none';$('#app').classList.add('on');$('#me').innerHTML=`<b>${esc(me.name)}</b><br>${me.role=='admin'?'Admin':'Staff'}<br><a href="#" style="color:#fff" onclick="try{sessionStorage.removeItem('masaU')}catch(e){};location.reload();return false">Logout</a>`;go('Dashboard')}
document.addEventListener('mousemove',e=>{const c=$('#lc');if(c&&$('#login').style.display!='none')c.style.transform=`rotateY(${(e.clientX/innerWidth-.5)*14}deg) rotateX(${(.5-e.clientY/innerHeight)*10}deg)`});
/* ---------- helpers ---------- */
const TABS=['Dashboard','Quick Job','Clients','Quotations','Service Orders','Contracts','Visit Schedule','Service Reports','Service History','Chemical Consumption','Reports','Settings'];
const nav=t=>$('#nav').innerHTML=TABS.map(x=>`<button class="${x==t?'on':''}" onclick="go('${x}')">${x}</button>`).join('');
function go(t){CUR=t;nav(t);$('#v').innerHTML=`<h2>${t}</h2>`+(me&&me.def?'<p class="warn">Please change the default admin password in Settings.</p>':'')+`<div class="card">${V[t]()}</div>`;if(t=='Quick Job')tg()}
const today=()=>new Date().toISOString().slice(0,10),addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const f=(id,l,v='',t='text')=>`<div><label>${l}<input id="${id}" type="${t}" value="${v}"></label></div>`;
const sel=(id,l,o)=>`<div><label>${l}<select id="${id}">${o.map(x=>`<option>${x}</option>`).join('')}</select></label></div>`;
const tbl=(h,rows)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')||`<tr><td colspan="${h.length}">Nothing here yet.</td></tr>`}</table></div>`;
const jb=id=>S.jobs.find(j=>j.id==id),tot=j=>j.price*j.nvis*(1-(j.disc||0)/100)*(1+j.tax/100);
const fd=m=>m===undefined||m===''||isNaN(m)?'-':U=='Hours'?(m/60).toFixed(2)+' h':m+' min';
const prow=(n='',q='',u='L')=>`<div class="pr grid3"><input class="pn" placeholder="Product name" value="${n}"><input class="pq" type="number" step="any" placeholder="Qty per visit" value="${q}"><select class="pu">${['L','ml','kg','g'].map(x=>`<option ${x==u?'selected':''}>${x}</option>`).join('')}</select></div>`;
const addP=()=>{const l=$('#pl');if(l.children.length>=10){msg('Maximum 10 products');return}l.insertAdjacentHTML('beforeend',prow())};
const tg=()=>{$('#aw').style.display=isT($('#svc').value)?'':'none'};
/* ---------- views ---------- */
const V={
'Quick Job':()=>`<p>Fill the form once. One click creates the quotation, service order, contract, visit schedule and history.</p><div class="grid">
${f('client','Client name')}${f('phone','Phone / WhatsApp')}${f('email','Client email','','email')}${f('addr','Site address')}${f('city','City','Lahore')}
<div><label>Service<select id="svc" onchange="tg()">${SVC.map(x=>`<option>${x}</option>`).join('')}</select></label></div><div id="aw" style="display:none">${f('area','Area (sq ft)','1000','number')}</div>
${f('dur','Contract duration (months)','12','number')}${sel('freq','Visit frequency',Object.keys(STEP))}${f('nvis','Number of visits','4','number')}${f('start','First visit date',addD(today(),1),'date')}
${f('price','Price per visit (PKR)','5000','number')}${f('tax','Sales tax %','16','number')}</div>
<p><b>Products / chemicals (up to 10)</b></p><div id="pl">${prow('Cypermethrin 10% EC',0.5)}</div><p><button class="btn s" onclick="addP()">+ Add product</button></p>
<button class="btn" onclick="gen()">Generate full set</button>`,
'Quotations':()=>docTab('q','qno'),'Service Orders':()=>docTab('s','sno'),'Contracts':()=>docTab('c','cno'),
'Visit Schedule':()=>`<p><label style="max-width:240px">Show service time in <select onchange="U=this.value;go('Visit Schedule')"><option ${U=='Minutes'?'selected':''}>Minutes</option><option ${U=='Hours'?'selected':''}>Hours</option></select></label></p>`+tbl(['Contract No.','Date','Client','Service','Technicians','Time in / out','Service time','Status',''],[...S.visits].sort((a,b)=>a.date<b.date?-1:1).map(v=>{const j=jb(v.jid)||{};const d=v.status=='Done';return`<tr><td>${v.cno||'-'}</td><td>${v.date}</td><td>${esc(v.client)}</td><td>${esc(v.svc)}</td><td>${esc(j.techs)||'-'}</td><td>${d?v.tin+' – '+v.tout:'-'}</td><td>${d?fd(v.mins):'-'}</td><td><span class="tag ${d?'d':''}">${v.status}${v.rs?' · rescheduled ×'+v.rs:''}</span></td><td>${d?'':`<button class="btn s" onclick="dn('${v.id}')">Complete</button> <button class="btn s" onclick="rsch('${v.id}')">Reschedule</button>`}</td></tr>`})),
'Service History':()=>`<div class="grid"><div><label>Search client or contract no.<input id="q" type="search" placeholder="Type a name or contract no." oninput="$('#hl').innerHTML=hist(this.value)"></label></div></div><div id="hl">${hist('')}</div>`,
'Chemical Consumption':()=>tbl(['Date','Contract No.','Client','Product','Quantity','Technicians'],S.chems.map(c=>`<tr><td>${c.date}</td><td>${c.cno||'-'}</td><td>${esc(c.client)}</td><td>${esc(c.chem)}</td><td>${c.qty} ${c.unit}</td><td>${esc(c.tech)||'-'}</td></tr>`)),
'Reports':()=>{const by={};S.chems.forEach(c=>by[c.chem+' ('+c.unit+')']=(by[c.chem+' ('+c.unit+')']||0)+ +c.qty);return`<div class="kpi"><div><b>${S.jobs.length}</b>Jobs</div><div><b>${S.visits.filter(v=>v.status=='Done').length}/${S.visits.length}</b>Visits done</div><div><b>${fmt(S.jobs.reduce((a,j)=>a+tot(j),0))}</b>Quoted value</div></div><h3>Chemical totals</h3>${tbl(['Product','Total used'],Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v.toFixed(2)}</td></tr>`))}<p><button class="btn" onclick="rpt()">Print report</button> <button class="btn s" onclick="shr()">Share report</button></p>`},
'Settings':()=>{const a=me.role=='admin';return`<h3>My password</h3><div class="grid">${f('op','Old password','','password')}${f('npw','New password (6+ characters)','','password')}</div><p><button class="btn" onclick="myPw()">Change my password</button></p>`+(a?`<hr><h3>Users</h3>${tbl(['User ID','Name','Role',''],S.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.role}</td><td><button class="btn s" onclick="rpw('${u.id}')">Reset password</button> ${u.id=='admin'?'':`<button class="btn s" onclick="du('${u.id}')">Delete</button>`}</td></tr>`))}<h4>Add a user</h4><div class="grid">${f('nn','Full name')}${f('nu','User ID')}${f('np','Password (6+ characters)','','password')}${sel('nr','Role',['staff','admin'])}</div><p><button class="btn" onclick="addU()">Add user</button></p>
<hr><h3>Sharing</h3><div class="grid">${f('cwa','Company WhatsApp number (optional)',S.cfg.wa)}${f('cml','Company email for internal copies',S.cfg.mail)}</div><p><button class="btn s" onclick="S.cfg.wa=$('#cwa').value.trim();S.cfg.mail=$('#cml').value.trim();save();msg('Saved')">Save sharing settings</button></p>
<hr><h3>Google Sheet connection</h3><div class="grid">${f('url','Apps Script web app URL',S.url)}</div><p><button class="btn s" onclick="S.url=$('#url').value.trim();save();msg('Saved')">Save URL</button> <button class="btn s" onclick="pull(()=>msg('Pulled from sheet'))">Pull data from Google Sheet</button> <button class="btn s" onclick="push()">Push all data to Google Sheet</button> <button class="btn s" onclick="exp()">Download backup file</button></p><p><button class="btn s" onclick="clearAll()">Clear all jobs in this app and restart numbering</button></p>`:'')}};
/* ---------- tables ---------- */
function docTab(p,k){const s=p=='s';return tbl(['No.','Date','Client','Service',s?'Technicians':'Total',''],S.jobs.map(j=>`<tr><td>${j[k]}</td><td>${j.date}</td><td>${esc(j.client)}</td><td>${esc(j.svc)}</td><td>${s?esc(j.techs)||'<i>not assigned</i>':fmt(tot(j))}</td><td>${s?`<button class="btn s" onclick="tech('${j.id}')">Technicians</button> `:''}<button class="btn s" onclick="pdoc('${j.id}','${p}')">Print / PDF</button> <button class="btn s" onclick="sh('${j.id}','${p}')">Share</button></td></tr>`))}

D.c=j=>`<div class="doc">${head('SERVICE CONTRACT')}${info(j,j.cno)}${money(j)}<h4>Scope of work – ${esc(j.svc)}</h4><ul>${(SCOPE[j.svc]||[]).map(x=>`<li>${x}</li>`).join('')}</ul><ol><li>${CO.name} will provide ${esc(j.svc)} at the site above for ${j.dur} months, with ${j.nvis} visit(s), ${String(j.freq).toLowerCase()}, from ${j.start}.</li><li>Total contract value is ${fmt(tot(j))} including tax, payable as agreed.</li><li>Registered products will be applied safely for people, pets and food areas.</li><li>Either party may end this contract with 15 days written notice.</li><li>Disputes will be settled by mutual discussion, then under the laws of Pakistan.</li></ol>${j.notes?`<p><b>Special notes:</b> ${esc(j.notes)}</p>`:''}${S.visits.some(v=>v.jid==j.id)?`<h4>Visit annex</h4>`+tbl(['#','Date','Status'],S.visits.filter(v=>v.jid==j.id).map((v,i)=>`<tr><td>${i+1}</td><td>${v.date}</td><td>${v.status}</td></tr>`)):''}${sig()}</div>`;

/* ---- Create Contracts ---- */
function ctList(){return tbl(['Quotation No.','Date','Client','Service','Quoted value','Contract No.','Status',''],S.jobs.slice().reverse().map(j=>{const st=j.status||'issued';
const act=st=='quoted'?`<button class="btn s" onclick="genC('${j.id}')">Generate contract</button>`:st=='draft'?`<button class="btn s" onclick="editC('${j.id}')">Edit</button> <button class="btn s" onclick="issueC('${j.id}')">Issue contract</button> <button class="btn s" onclick="pdoc('${j.id}','c')">Print draft</button>`:`<button class="btn s" onclick="pdoc('${j.id}','c')">Print</button> <button class="btn s" onclick="sh('${j.id}','c')">Share</button>`;
return`<tr><td>${j.qno}</td><td>${j.date}</td><td>${esc(j.client)}</td><td>${esc(j.svc)}</td><td>${fmt(tot(j))}</td><td>${j.cno||'-'}</td><td><span class="tag ${st=='issued'?'d':''}">${st=='quoted'?'Quotation ready':st=='draft'?'Draft (editable)':'Issued'}</span></td><td>${act}</td></tr>`}))}
function genC(id){const j=jb(id);if(!j.cno)j.cno=num('MPK-C','c');j.status='draft';save();sync('jobs',j);editC(id)}
function editC(id){const j=jb(id);if((j.status||'issued')!='draft'){msg('Only draft contracts can be edited');return}
modal(`<h3>Contract ${j.cno} – draft</h3><p>You can change these until you issue the contract. After issue, editing is locked.</p><div class="grid"><div><label>Visit frequency<select id="ce_freq">${Object.keys(STEP).map(x=>`<option ${x==j.freq?'selected':''}>${x}</option>`).join('')}</select></label></div>${f('ce_dur','Contract duration (months)',j.dur,'number')}${f('ce_nvis','Number of visits',j.nvis,'number')}${f('ce_start','First visit date',j.start,'date')}${f('ce_price','Price per visit (PKR)',j.price,'number')}${f('ce_tax','Sales tax %',j.tax,'number')}${f('ce_disc','Discount %',j.disc||0,'number')}<div><label>Special notes<input id="ce_notes" value="${esc(j.notes||'')}"></label></div></div><p><button class="btn" onclick="saveC('${id}')">Save draft</button></p>`)}
function saveC(id){const j=jb(id);if((j.status||'issued')!='draft'){msg('Contract is already issued');return}
Object.assign(j,{freq:$('#ce_freq').value,dur:+$('#ce_dur').value,nvis:+$('#ce_nvis').value,start:$('#ce_start').value,price:+$('#ce_price').value,tax:+$('#ce_tax').value,disc:+$('#ce_disc').value||0,notes:$('#ce_notes').value.trim()});
save();sync('jobs',j);mc();go('Create Contracts')}
function issueC(id){const j=jb(id);if((j.status||'issued')!='draft')return;
if(!confirm('Issue contract '+j.cno+'? After issuing, it cannot be edited. Visits will be scheduled automatically.'))return;
for(let i=0;i<j.nvis;i++){const v={id:j.id+'-'+i,jid:j.id,cno:j.cno,client:j.client,svc:j.svc,date:addD(j.start,i*STEP[j.freq]),status:'Scheduled'};S.visits.push(v);sync('visits',v)}
j.status='issued';save();sync('jobs',j);msg('Contract issued with '+j.nvis+' visits');go('Create Contracts')}
function contractHist(){return tbl(['Contract No.','Date','Client','Service','Visits','Contract value',''],S.jobs.filter(j=>(j.status||'issued')=='issued').reverse().map(j=>`<tr><td>${j.cno}</td><td>${j.date}</td><td>${esc(j.client)}</td><td>${esc(j.svc)}</td><td>${j.nvis}</td><td>${fmt(tot(j))}</td><td><button class="btn s" onclick="pdoc('${j.id}','c')">Print</button> <button class="btn s" onclick="sh('${j.id}','c')">Share</button></td></tr>`))}

/* ---- Schedule Visit ---- */
V['Visit Schedule']=()=>`<p><button class="btn ${VM=='List'?'':'s'}" onclick="VM='List';go('Create SOR',0)">List</button> <button class="btn ${VM=='Calendar'?'':'s'}" onclick="VM='Calendar';go('Create SOR',0)">Calendar</button></p>`+(VM=='List'?schedList():cal());
function schedList(){return tbl(['Contract No.','Date','Client','Service','Technicians','Status','Reschedules',''],[...S.visits].sort((a,b)=>String(a.date)<String(b.date)?-1:1).map(v=>{const j=jb(v.jid)||{};const d=v.status=='Done';
return`<tr><td>${v.cno||'-'}</td><td>${v.date}</td><td>${esc(v.client)}</td><td>${esc(v.svc)}</td><td>${esc(j.techs)||'-'}</td><td><span class="tag ${d?'d':''}">${d?'SOR done':'Scheduled'}</span></td><td>${v.rs||0}</td><td>${d?'':`<button class="btn s" onclick="resV('${v.id}')">Reschedule</button>`}</td></tr>`}))}
function resV(id){const v=S.visits.find(x=>x.id==id);modal(`<h3>Reschedule visit</h3><p>${esc(v.client)} – ${v.cno}. Current date: <b>${v.date}</b></p><div class="grid">${f('rd','New date',v.date,'date')}${f('rr','Reason for rescheduling')}</div><p><button class="btn" onclick="resSave('${id}')">Save new date</button></p>`)}
function resSave(id){const v=S.visits.find(x=>x.id==id),to=$('#rd').value;if(!to){msg('Choose a new date');return}
v.hist=v.hist||[];v.hist.push({from:v.date,to,reason:$('#rr').value.trim(),on:today()});v.date=to;v.rs=(v.rs||0)+1;save();sync('visits',v);mc();go('Create SOR',0)}

/* ---- Create SOR (Service Order Report) ---- */
function sorCreate(){return tbl(['Date','Client','Contract No.','Service','Technicians','Action'],S.visits.filter(v=>v.status!='Done').sort((a,b)=>String(a.date)<String(b.date)?-1:1).map(v=>{const j=jb(v.jid)||{};
return`<tr><td>${v.date}</td><td>${esc(v.client)}</td><td>${v.cno}</td><td>${esc(v.svc)}</td><td>${esc(j.techs)||'-'}</td><td><button class="btn s" onclick="tech('${j.id}')">Technicians</button> <button class="btn" onclick="openSOR('${v.id}')">Create SOR</button></td></tr>`}))+'<p style="font-size:12px;color:#7a4a50">Scheduled visits appear here. After saving, the SOR is listed in History > SOR History.</p>'}
const chemRow=(n,q,u)=>`<div class="grid3 cr"><input class="cn" list="stl" value="${esc(n)}" placeholder="Chemical / material"><input class="cq" type="number" step="any" value="${q}" placeholder="Qty"><select class="cu">${['L','ml','kg','g','pcs'].map(x=>`<option ${x==u?'selected':''}>${x}</option>`).join('')}</select></div>`;
function addChem(){if(document.querySelectorAll('#cl .cr').length>=10){msg('Maximum 10 chemicals');return}$('#cl').insertAdjacentHTML('beforeend',chemRow('','','L'))}
function openSOR(id){const v=S.visits.find(x=>x.id==id),j=jb(v.jid)||{prods:[]};const rows=j.prods&&j.prods.length?j.prods:[{n:'',q:'',u:'L'}];
modal(`<h3>Create SOR – ${esc(v.client)} (${v.cno})</h3><p>Service date: <b>${v.date}</b> · ${esc(v.svc)}</p>
<datalist id="stl">${S.stock.map(s=>`<option value="${esc(s.id)}">`).join('')}</datalist>
<div class="grid">${f('ti','Time in','','time')}${f('to','Time out','','time')}</div><p>Service time: <b id="dd">-</b></p>
<p><b>Chemicals used</b> (name, quantity, unit)</p><div id="cl">${rows.map(p=>chemRow(p.n,p.q,p.u)).join('')}</div><p><button class="btn s" onclick="addChem()">+ Add chemical</button></p>
<label>Other materials used (optional, one per line)<textarea id="om" rows="2"></textarea></label>
<label>Remarks<textarea id="rm" rows="3"></textarea></label>
<div class="grid">${sel('rt','Client rating (optional)',['5','4','3','2','1'])}</div>
<p>Client signature</p><canvas id="sc" class="sg" width="300" height="90"></canvas><p>Technician signature</p><canvas id="st" class="sg" width="300" height="90"></canvas>
<p><button class="btn" onclick="saveSOR('${id}')">Save SOR</button></p>`);
document.querySelectorAll('#ti,#to').forEach(e=>e.oninput=()=>{const m=mins();$('#dd').textContent=m===null?'-':m+' min ('+(m/60).toFixed(2)+' h)'});pad('sc');pad('st')}
function mv(name,type,q,unit,note){let s=S.stock.find(x=>x.id==name);if(!s){s={id:name,qty:0,unit:unit,min:0};S.stock.push(s)}
s.qty=Math.round((+s.qty+(type=='IN'?q:-q))*1000)/1000;const m={id:'M'+Date.now()+Math.random().toString(36).slice(2,6),date:today(),product:name,type,qty:q,unit:s.unit||unit,note:note||''};
S.moves.push(m);sync('stock',s);sync('moves',m);save();return m}
function saveSOR(id){const m=mins();if(m===null){msg('Enter time in and time out');return}
const v=S.visits.find(x=>x.id==id),j=jb(v.jid)||{techs:''};
const chems=[...document.querySelectorAll('#cl .cr')].map(r=>({n:r.querySelector('.cn').value.trim(),q:+r.querySelector('.cq').value||0,u:r.querySelector('.cu').value})).filter(c=>c.n&&c.q>0);
const rno=v.rno||num('MPK-SR','r');
Object.assign(v,{status:'Done',tin:$('#ti').value,tout:$('#to').value,mins:m,remarks:$('#rm').value.trim(),others:$('#om').value.trim(),rate:+$('#rt').value,sigc:blank($('#sc'))?'':$('#sc').toDataURL(),sigt:blank($('#st'))?'':$('#st').toDataURL(),rno});
sync('visits',v);
S.chems=S.chems.filter(c=>c.vid!=id);
chems.forEach((c,i)=>{const rec={id:'C'+id+'-'+i,vid:id,cno:v.cno,date:today(),client:v.client,chem:c.n,qty:c.q,unit:c.u,tech:j.techs||'',rno};S.chems.push(rec);sync('chems',rec);
if(S.stock.some(s=>s.id==c.n))mv(c.n,'OUT',c.q,c.u,'SOR '+rno)});
save();go('Create SOR',1);
modal(`<h3>SOR ${rno} saved</h3><p>Print it or share it with the client.</p><p><button class="btn" onclick="mc();prep('${id}')">Print / save PDF</button> <button class="btn s" onclick="mc();rsh('${id}')">Share</button></p>`)}
D.r=v=>{const j=jb(v.jid)||{techs:''},ch=S.chems.filter(c=>c.vid==v.id);
return`<div class="doc">${head('SERVICE ORDER REPORT (SOR)')}<table><tr><th>SOR No.</th><td>${v.rno||'-'}</td><th>Contract</th><td>${v.cno}</td></tr><tr><th>Client</th><td>${esc(v.client)}</td><th>Date</th><td>${v.date}</td></tr><tr><th>Service</th><td>${esc(v.svc)}</td><th>Technicians</th><td>${esc(j.techs)||'-'}</td></tr><tr><th>Time in / out</th><td>${v.tin} – ${v.tout}</td><th>Service time</th><td>${v.mins} min (${(v.mins/60).toFixed(2)} h)</td></tr></table><h4>Chemicals used</h4>${tbl(['Product','Quantity'],ch.map(c=>`<tr><td>${esc(c.chem)}</td><td>${c.qty} ${c.unit}</td></tr>`))}${v.others?`<h4>Other materials used</h4><p>${esc(v.others).replace(/\n/g,'<br>')}</p>`:''}<h4>Remarks</h4><p>${esc(v.remarks)||'-'}</p><p>Client rating: <b style="color:#C8102E">${stars(v.rate)}</b></p><div class="sig"><div>${v.sigc?`<img src="${v.sigc}" style="height:60px"><br>`:''}Client signature</div><div>${v.sigt?`<img src="${v.sigt}" style="height:60px"><br>`:''}Technician signature</div></div></div>`};

/* ---- Inventory: stock in / stock out ---- */
function invStock2(){const sum=(n,t)=>S.moves.filter(m=>m.product==n&&m.type==t).reduce((a,m)=>a+ +m.qty,0);
return tbl(['Product','Stock in (total)','Stock out (total)','Balance','Unit'],S.stock.map(s=>`<tr><td>${esc(s.id)}</td><td>${sum(s.id,'IN')}</td><td>${sum(s.id,'OUT')}</td><td><b>${s.qty}</b></td><td>${s.unit}</td></tr>`))+
`<h4 style="margin-top:16px">Stock in</h4><datalist id="stl2">${S.stock.map(s=>`<option value="${esc(s.id)}">`).join('')}</datalist><div class="grid">${f('sn','Product name')}${f('sq','Quantity','','number')}${sel('su','Unit',['L','ml','kg','g','pcs'])}${f('sx','Note (supplier, batch)')}</div><p><button class="btn" onclick="stockIn()">Add stock in</button></p>`+
`<h4>Stock out</h4><div class="grid"><div><label>Product<select id="so">${S.stock.map(s=>`<option value="${esc(s.id)}">${esc(s.id)} (balance ${s.qty} ${s.unit})</option>`).join('')}</select></label></div>${f('soq','Quantity','','number')}${f('sox','Reason / note')}</div><p><button class="btn s" onclick="stockOut()">Record stock out</button></p>`+
`<h4>Recent movements</h4>`+tbl(['Date','Product','Type','Quantity','Note'],S.moves.slice(-20).reverse().map(m=>`<tr><td>${m.date}</td><td>${esc(m.product)}</td><td>${m.type=='IN'?'Stock in':'Stock out'}</td><td>${m.qty} ${m.unit}</td><td>${esc(m.note)}</td></tr>`))}
function stockIn(){const n=$('#sn').value.trim(),q=+$('#sq').value,u=$('#su').value;if(!n||!(q>0)){msg('Enter product and quantity');return}mv(n,'IN',q,u,$('#sx').value.trim());go('Inventory')}
function stockOut(){const n=$('#so').value,q=+$('#soq').value,s=S.stock.find(x=>x.id==n);if(!s||!(q>0)){msg('Choose product and quantity');return}if(q>s.qty){msg('Not enough stock. Balance is '+s.qty+' '+s.unit);return}mv(n,'OUT',q,s.unit,$('#sox').value.trim());go('Inventory')}

/* ---- Invoicing ---- */
function inum(){const n=Math.max(0,...(S.invoices||[]).map(i=>+String(i.ino||'').split('-').pop()||0));return'MPK-INV-'+new Date().getFullYear()+'-'+String(n+1).padStart(4,'0')}
const paidOf=j=>(S.invoices||[]).filter(i=>i.jid==j.id&&i.status=='Settled').reduce((a,i)=>a+ +i.amount,0);
function invRows(L){return tbl(['Invoice No.','Date','Client','Phone','Area','Contract No.','Type','Amount','',''],L.map(i=>`<tr><td>${i.ino}</td><td>${i.date}</td><td>${esc(i.client)}</td><td>${esc(i.phone)}</td><td>${esc(i.area)}</td><td>${i.cno}</td><td>${i.type}</td><td>${fmt(i.amount)}</td><td><button class="btn s" onclick="togInv('${i.id}')">Mark ${i.status=='Settled'?'unsettled':'settled'}</button></td><td><button class="btn s" onclick="printInv('${i.id}')">Print</button></td></tr>`))}
function invPage(){const I=S.invoices||[],iss=S.jobs.filter(j=>(j.status||'issued')=='issued'),se=I.filter(i=>i.status=='Settled'),un=I.filter(i=>i.status!='Settled'),sum=a=>a.reduce((s,i)=>s+ +i.amount,0);
const pc=iss.filter(j=>paidOf(j)>=tot(j)-0.5),uc=iss.filter(j=>paidOf(j)<tot(j)-0.5);
return`<p><button class="btn" onclick="invSearch()">+ Create invoice</button></p>
<div class="kpi"><div><b>${pc.length}</b>Contracts paid</div><div><b>${uc.length}</b>Contracts unpaid</div><div><b>${se.length} · ${fmt(sum(se))}</b>Settled invoices</div><div><b>${un.length} · ${fmt(sum(un))}</b>Unsettled invoices</div></div>
<h4>Contract payment status</h4>`+tbl(['Contract No.','Client','Contract value','Settled','Balance','Status'],iss.map(j=>{const p=paidOf(j);return`<tr><td>${j.cno}</td><td>${esc(j.client)}</td><td>${fmt(tot(j))}</td><td>${fmt(p)}</td><td>${fmt(Math.max(0,tot(j)-p))}</td><td><span class="tag ${p>=tot(j)-0.5?'d':''}">${p>=tot(j)-0.5?'Paid':'Unpaid'}</span></td></tr>`}))+
`<h4>Unsettled invoices</h4>${invRows(un)}<h4>Settled invoices</h4>${invRows(se)}`}
function invSearch(){modal(`<h3>Create invoice</h3><label>Search by client name, phone number, area or contract number<input id="isq" type="search" placeholder="Type to search" oninput="invRes(this.value)"></label><div id="isr" style="margin-top:10px">${'<p>Start typing to find a contract.</p>'}</div>`);invRes('')}
function invRes(q){q=q.trim().toLowerCase();const L=S.jobs.filter(j=>(j.status||'issued')=='issued').filter(j=>!q||[j.client,j.phone,j.city,j.addr,j.area,j.cno].some(x=>String(x||'').toLowerCase().includes(q)));
$('#isr').innerHTML=L.length?tbl(['Contract No.','Client','Phone','Area','Contract value',''],L.map(j=>`<tr><td>${j.cno}</td><td>${esc(j.client)}</td><td>${esc(j.phone)}</td><td>${esc(j.city)}</td><td>${fmt(tot(j))}</td><td><button class="btn s" onclick="invPick('${j.id}')">Select</button></td></tr>`)):'<p class="warn">No active contract matches.</p>'}
function invPick(id){const j=jb(id),billed=(S.invoices||[]).filter(i=>i.jid==id).reduce((a,i)=>a+ +i.amount,0);
modal(`<h3>Invoice for ${j.cno} – ${esc(j.client)}</h3><p>Contract value: <b>${fmt(tot(j))}</b> · Already invoiced: <b>${fmt(billed)}</b></p>
<p><label><input type="radio" name="it" value="full" checked> Full contract amount (${fmt(tot(j))})</label><br><label><input type="radio" name="it" value="half"> Half of contract amount (${fmt(tot(j)/2)})</label><br><label><input type="radio" name="it" value="prog"> Progressive billing (enter amount below)</label></p>
<div class="grid">${f('pamt','Progressive amount (PKR)','','number')}</div><p><button class="btn" onclick="invSave('${id}')">Create invoice</button></p>`)}
function invSave(jid){const j=jb(jid),t=document.querySelector('input[name=it]:checked').value;const amt=t=='full'?tot(j):t=='half'?tot(j)/2:+$('#pamt').value;
if(!(amt>0)){msg('Enter an amount');return}
const billed=(S.invoices||[]).filter(i=>i.jid==jid).reduce((a,i)=>a+ +i.amount,0);
if(billed+amt>tot(j)+0.5){msg('Total invoiced would exceed the contract value. Balance left: '+fmt(tot(j)-billed));return}
const inv={id:'I'+Date.now(),ino:inum(),jid,cno:j.cno,client:j.client,phone:j.phone,area:j.city,type:t=='full'?'Full contract':t=='half'?'50% of contract':'Progressive',amount:Math.round(amt),date:today(),status:'Unsettled'};
S.invoices.push(inv);sync('invoices',inv);save();mc();msg('Invoice '+inv.ino+' created');go('Invoicing')}
function togInv(id){const i=S.invoices.find(x=>x.id==id);i.status=i.status=='Settled'?'Unsettled':'Settled';save();sync('invoices',i);go('Invoicing')}
function printInv(id){const i=S.invoices.find(x=>x.id==id);$('#pr').innerHTML=D.i(i);setTimeout(()=>print(),150)}
D.i=i=>{const j=jb(i.jid)||{};return`<div class="doc">${head('INVOICE')}<table><tr><th>Invoice No.</th><td>${i.ino}</td><th>Date</th><td>${i.date}</td></tr><tr><th>Client</th><td>${esc(i.client)}</td><th>Phone</th><td>${esc(i.phone)}</td></tr><tr><th>Contract No.</th><td>${i.cno}</td><th>Area</th><td>${esc(i.area)}</td></tr></table><br><table><tr><th>Description</th><th>Billing type</th><th>Contract value</th><th>Amount invoiced</th></tr><tr><td>${esc(j.svc)} – ${j.nvis} visits (${j.freq})</td><td>${i.type}</td><td>${fmt(tot(j))}</td><td><b>${fmt(i.amount)}</b></td></tr></table><p>Status: <b>${i.status.toUpperCase()}</b></p><p>Please make payment to ${CO.name} on receipt of this invoice.</p>${sig()}</div>`};

/* ---- Reports ---- */
function mrRows(){const out=[],ym=MR.m,q=(MR.val||'').toLowerCase();
S.jobs.filter(j=>(j.status||'issued')=='issued').forEach(j=>{const vis=S.visits.filter(v=>v.jid==j.id),inM=vis.filter(v=>mk(v.date)==ym);if(!inM.length)return;
if(MR.mode=='Client wise'&&q&&String(j.client).toLowerCase()!=q)return;
if(MR.mode=='Area wise'&&q&&!((j.city+' '+j.addr+' '+j.area).toLowerCase().includes(q)))return;
if(MR.mode=='Technician wise'&&q&&!String(j.techs||'').toLowerCase().includes(q))return;
const sors=vis.filter(v=>v.status=='Done'&&mk(v.date)==ym&&v.rno).map(v=>v.rno).join(', ')||'-';
out.push({client:j.client,cno:j.cno,sor:sors,svc:j.svc,area:[j.city,j.addr].filter(Boolean).join(' – '),value:Math.round(tot(j)/Math.max(1,j.nvis)*inM.length),remaining:vis.filter(v=>v.status!='Done').length,total:vis.length,freq:j.freq})});
return out}
